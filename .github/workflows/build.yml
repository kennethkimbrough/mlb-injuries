name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the page logic
        run: node --test site/injuries.test.mjs
