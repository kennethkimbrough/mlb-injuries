name: Daily injury snapshot

on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC, about 9:17 ET, after overnight roster moves
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build
        run: mvn -B -q -DskipTests package
      - name: Fetch today's injured lists and add them to the history
        run: |
          java -jar target/mlb-injuries.jar fetch --save | tee -a "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          java -jar target/mlb-injuries.jar report >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/injuries.csv
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Record injury snapshot for $(TZ=America/New_York date +%Y-%m-%d)"
          git push
